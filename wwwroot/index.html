<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Avalonia Blazor Hybrid · ura.cn</title>
    <base href="/" />
    <link href="css/app.css" rel="stylesheet" />
    <script src="blazor/bridge.js"></script>
</head>
<body>
    <div id="app">
        <div class="boot">正在启动 Blazor Hybrid…</div>
    </div>

    <div id="blazor-error-ui">
        Blazor 组件发生未处理的异常。
        <a href="" class="reload">重新加载</a>
        <a class="dismiss">✕</a>
    </div>

    <!-- Shipped on disk (wwwroot/blazor/) so NativeAOT needs no static-web-assets
         manifest, which would otherwise depend on Assembly.Location. -->
    <script src="blazor/blazor.webview.js"></script>
</body>
</html>
